name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: python server/test_config_sync.py
      - run: python -m py_compile release/initialize.py release/build_release.py
